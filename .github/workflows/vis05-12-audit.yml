name: VIS05-12 specification and focused audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/vis05-12-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/vis02-04-city23-regression')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Focused adversarial and navigation tests
        run: |
          python -B -X utf8 -m unittest discover -s tests -p 'test_water_navigation_v2.py' -v
          python -B -X utf8 -m unittest discover -s tests -p 'test_water_survey.py' -v
          python -B -X utf8 -m unittest discover -s tests -p 'test_vis_evidence.py' -v
          python -B -X utf8 -m unittest discover -s tests -p 'test_road_support_recovery.py' -v
          python -B -X utf8 -m unittest discover -s tests -p 'test_medium_reassignment.py' -v
      - name: Production corridor and roof stress (ASan and UBSan)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/vis05_12_corridor_stress.cpp -o /tmp/vis05_12_stress
          /tmp/vis05_12_stress
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tools/vis05_12_corridor_stress.cpp -o /tmp/vis05_12_stress_sanitized
          /tmp/vis05_12_stress_sanitized
      - name: Runtime Python dependency advisory scan
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --strict
  specification:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/vis02-04-city23-regression')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
      - name: Fetch only specification and explanatory PDFs
        run: |
          git lfs version
          timeout 90s git lfs pull --include='ТЗ/*.pdf,ПЗ/Пояснительная записка*.pdf' --exclude=''
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Verify source PDF hashes and extractability
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          paths = sorted(Path('ТЗ').glob('*.pdf')) + sorted(Path('ПЗ').glob('Пояснительная записка*.pdf'))
          if len(paths)!=4:
              raise SystemExit('Expected four source PDFs')
          for path in paths:
              data=path.read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise SystemExit('PDF not materialized: '+path.name)
              raw=subprocess.check_output(['pdftotext','-layout',str(path),'-'], timeout=30).decode('utf-8')
              if not raw.strip():raise SystemExit('No extractable text: '+path.name)
              print('DOCUMENT',path.name,'SHA256',hashlib.sha256(data).hexdigest(),
                    'pages',len([p for p in raw.split('\f') if p.strip()]))
          PY
