name: City road geometry portable regression
on:
  push:
    branches: [main, chatgpt/city-road-visual-repair]
    paths:
      - 'unreal/MetaRescue/Source/MetaRescue/MRStreetGeometry.h'
      - 'unreal/MetaRescue/Source/MetaRescue/MRCity.cpp'
      - 'unreal/MetaRescue/Source/MetaRescue/MRStreetSignals.cpp'
      - 'unreal/MetaRescue/Source/MetaRescue/MRWorld.h'
      - 'tools/street_geometry_probe.cpp'
      - '.github/workflows/city-road-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  street-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Compile and run the runtime geometry without UE
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Iunreal/MetaRescue/Source/MetaRescue tools/street_geometry_probe.cpp -o "$RUNNER_TEMP/street_geometry_probe"
          "$RUNNER_TEMP/street_geometry_probe"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify unchanged street layout and physical support
        run: |
          python -B -X utf8 -m unittest discover -s tests -p test_city_streets.py -v
          python -B -X utf8 -m unittest discover -s tests -p test_urban_terrain.py -v
          python -B -X utf8 -m unittest discover -s tests -p test_road_support_recovery.py -v
